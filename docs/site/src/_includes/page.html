<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="doc-root" content="{{ "/" | url }}">
<title>{{ page.title }} · Kursal Docs</title>
<script>try{var theme=localStorage.getItem('kursal-doc-theme');if(theme==='light'||theme==='dark')document.documentElement.setAttribute('data-theme',theme)}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="{{ "/assets/logo.svg" | asset_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="{{ "/assets/site.css" | asset_url }}">
<script defer src="{{ "/assets/theme.js" | asset_url }}"></script>
<script defer src="{{ "/assets/search.js" | asset_url }}"></script>
</head>
<body>
<header class="masthead"><div class="masthead-inner"><a class="brand" href="{{ "/" | url }}"><span class="brand-mark" aria-hidden="true"><span class="brand-glyph"></span></span> Kursal <span class="brand-sub">Docs</span></a><div class="search" role="search"><label class="visually-hidden" for="doc-search">Search the documentation</label><input id="doc-search" class="search-input" type="search" placeholder="Search (press /)" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="doc-search-results" aria-autocomplete="list"><ul id="doc-search-results" class="search-results" role="listbox" aria-label="Search results" hidden></ul><p class="visually-hidden" id="doc-search-status" role="status" aria-live="polite"></p></div><div class="header-actions"><span class="header-kicker">API Reference</span><button class="theme-toggle" type="button" data-next="light" aria-label="Switch to light mode" title="Switch to light mode"><svg class="theme-icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.1A8.7 8.7 0 0 1 9.9 3.5 8.8 8.8 0 1 0 20.5 14.1Z"/></svg><svg class="theme-icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg></button></div></div></header>
{{ content | safe }}
<footer class="site-footer"><strong>Kursal</strong> API reference, built with <strong>Krayon</strong>, part of the Kursion ecosystem.</footer>
</body>
</html>
