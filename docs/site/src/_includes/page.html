<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F3F4F8">
<meta name="doc-root" content="{{ "/" | url }}">
<title>{{ page.title }} · kursal docs</title>
<script>(function(){var d=document.documentElement,t=null;try{t=localStorage.getItem('kursal-theme')}catch(e){}if(t!=='light'&&t!=='dark')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';d.dataset.theme=t})()</script>
<link rel="icon" type="image/svg+xml" href="{{ "/assets/favicon.svg" | asset_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="{{ "/assets/site.css" | asset_url }}">
<style>.brand-mark::after{-webkit-mask-image:url("{{ "/assets/logo.svg" | asset_url }}");mask-image:url("{{ "/assets/logo.svg" | asset_url }}")}</style>
<script defer src="{{ "/assets/theme.js" | asset_url }}"></script>
<script defer src="{{ "/assets/search.js" | asset_url }}"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header"><div class="shell header-inner">
<a class="brand" href="{{ "/" | url }}" aria-label="kursal docs home"><span class="brand-mark" aria-hidden="true"></span><span>kursal</span><span class="brand-sub">docs</span></a>
<div class="search" role="search"><label class="visually-hidden" for="doc-search">Search the documentation</label><input id="doc-search" class="search-input" type="search" placeholder="Search (press /)" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="doc-search-results" aria-autocomplete="list"><ul id="doc-search-results" class="search-results" role="listbox" aria-label="Search results" hidden></ul><p class="visually-hidden" id="doc-search-status" role="status" aria-live="polite"></p></div>
<nav class="site-nav" aria-label="kursal.dev"><a href="https://kursal.dev/guide/">Guide</a><a href="https://kursal.dev/book/">Book</a></nav>
<button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode"><svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg><svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.1A8.7 8.7 0 0 1 9.9 3.5 8.8 8.8 0 1 0 20.5 14.1Z"/></svg></button>
</div></header>
{{ content | safe }}
<footer class="site-footer"><div class="shell footer-inner"><a class="footer-brand" href="https://kursal.dev/">kursal<span>.</span></a><p>The API reference of kursal's packages, generated from their source by <code>kursal doc</code> and built with <a href="https://github.com/kursionlabs/krayon">Krayon</a>, the Kursion static-site generator.</p></div></footer>
</body>
</html>
