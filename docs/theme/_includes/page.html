<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} · Kursal Docs</title>
<script>try{var theme=localStorage.getItem('kursal-doc-theme');if(theme==='light'||theme==='dark')document.documentElement.setAttribute('data-theme',theme)}catch(e){}</script>
<link rel="stylesheet" href="{{ "/assets/site.css" | url }}?v=2">
<script defer src="{{ "/assets/theme.js" | url }}"></script>
</head>
<body>
<header class="masthead"><div class="masthead-inner"><a class="brand" href="{{ "/" | url }}"><span class="brand-mark">K</span> Kursal <span class="brand-sub">Docs</span></a><div class="header-actions"><span class="header-kicker">API Reference</span><button class="theme-toggle" type="button" data-next="dark" aria-label="Switch to dark mode" title="Switch to dark mode"><svg class="theme-icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.1A8.7 8.7 0 0 1 9.9 3.5 8.8 8.8 0 1 0 20.5 14.1Z"/></svg><svg class="theme-icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg></button></div></div></header>
{{ content | safe }}
</body>
</html>
