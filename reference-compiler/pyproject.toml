[project]
name = "kursal"
version = "0.1.0"
description = "The reference compiler for Kursal"
license = "MIT OR Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.6",
]

[tool.mypy]
python_version = "3.12"
files = ["kursal"]
strict = true
disallow_any_expr = true
disallow_any_explicit = true

[tool.ruff.lint]
# Nullable types use Optional[T] for textbook-style function headers.
ignore = ["UP045"]
